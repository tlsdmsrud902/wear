<section class="wear-page-hero wear-menu-hero" aria-label="컬렉션 안내" data-cms="목록 위 큰 배너" data-cms-adapter="menuHero" data-cms-page="목록 공통">
 <img src="/SkinImg/wear/scene-closet.webp" alt="행거에 걸린 니트 · 코트 · 원피스 · 블라우스" width="1600" height="900" fetchpriority="high">
 <div><small>THE EVERYDAY COLLECTION</small><h1>Good wear.<br>For every day.</h1><p>고르고, 입고, 오래 아끼는 하루.<br>내 옷장에 꼭 맞는 옷을 찾아보세요.</p>
 <nav aria-label="컬렉션 메뉴"><a data-wear-menu="all" href="/product/list.html?cate_no=28">전체상품</a><a data-wear-menu="outer" href="/product/list.html?cate_no=24">아우터</a><a data-wear-menu="tops" href="/product/list.html?cate_no=25">상의</a><a data-wear-menu="dress" href="/product/list.html?cate_no=26">원피스/스커트</a><a data-wear-menu="review" href="/board/product/list.html?board_no=4">리뷰</a></nav></div>
</section>
<!-- 상품분류 목록에서만 보이는 검색창 (상품검색 페이지는 자체 검색창이 있다) -->
<form class="wear-list-search" action="/product/search.html" method="get" role="search" hidden>
 <label for="wearListKeyword" class="displaynone">상품 검색</label>
 <input id="wearListKeyword" name="keyword" type="search" placeholder="찾으시는 상품을 검색해 보세요" autocomplete="off">
 <button type="submit" aria-label="검색"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5" stroke-linecap="round"></path></svg></button>
</form>
<script>
(function(){
 var hero=document.querySelector('.wear-menu-hero');if(!hero)return;
 var params=new URLSearchParams(location.search),word=params.get('keyword')||'',path=location.pathname,board=path.indexOf('/board/')===0;
 var catm=path.match(/\/category\/[^\/]+\/(\d+)/),cate=String(params.get('cate_no')||(catm&&catm[1])||'');
 var list=/\/product\/list\.html$/.test(path)||!!catm;
 // 게시판 : 리뷰(4) · 공지사항(1) · 자주묻는질문(3) · 상품문의(6) 은 같은 배너를 쓴다
 var boardKey={'4':'review','1':'notice','3':'faq','6':'qna'}[params.get('board_no')];
 if(board&&!boardKey){hero.remove();return;}
 // SALE(27)은 전용 세일 화면이 따로 있다
 if(list&&cate==='27'){hero.remove();return;}
 // 상품분류 번호 : 28 전체 상품 · 24 아우터 · 25 상의 · 26 원피스/스커트 (관리자 대분류)
 var byCate={'28':'all','24':'outer','25':'tops','26':'dress'};
 var key=board?boardKey:list?(byCate[cate]||'all'):/원피스|스커트|데님|팬츠|슬랙스|드레스/.test(word)?'dress':/셔츠|블라우스|니트|티셔츠|가디건|맨투맨|상의/.test(word)?'tops':/코트|트렌치|재킷|자켓|점퍼|패딩|베스트|아우터/.test(word)?'outer':'all';
 // 배너 내용 : 게시판 화면 관리의 '목록 위 큰 배너' 글로 바꿀 수 있다 (wear-cms.js 가 window.WEAR902_MENU_HERO 를 덮어쓴다)
 var banners=window.WEAR902_MENU_HERO=window.WEAR902_MENU_HERO||{
  all:['scene-closet.webp','행거에 걸린 니트 · 코트 · 원피스 · 블라우스','THE EVERYDAY COLLECTION','Good wear.<br>For every day.','고르고, 입고, 오래 아끼는 하루.<br>내 옷장에 꼭 맞는 옷을 찾아보세요.'],
  outer:['scene-trench.webp','회색 아치 앞에 걸린 베이지 트렌치코트','THE OUTER COLLECTION','Layer up.<br>Stay light.','울 코트와 트렌치, 가벼운 재킷까지.<br>계절이 바뀌어도 꺼내 입는 아우터.'],
  tops:['scene-knit.webp','행거에 걸린 크림 · 와인 · 세이지 니트','THE EVERYDAY TOPS','Easy tops.<br>Busy days.','구김 걱정 없는 셔츠부터<br>부드러운 니트 · 블라우스까지.'],
  dress:['scene-dress.webp','세이지 벽 앞에 걸린 크림 원피스','THE DRESS &amp; SKIRT COLLECTION','Soft lines.<br>Easy days.','한 벌로 완성되는 원피스부터<br>플리츠 스커트 · 와이드 팬츠까지.'],
  review:['scene-linen.webp','린넨 셔츠와 와이드 팬츠','WEAR, SHARED','Real reviews.<br>Real fit.','직접 입어 본 경험이 더 좋은 선택으로.<br>wear902 고객의 착용 후기를 만나보세요.'],
  notice:['scene-blouse.webp','하늘색 아치 앞에 걸린 화이트 블라우스','NEWS &amp; NOTICE','Little news.<br>From wear902.','wear902의 새로운 소식과<br>꼭 알아 두실 안내를 전해 드려요.'],
  faq:['scene-blouse.webp','하늘색 아치 앞에 걸린 화이트 블라우스','GOOD TO KNOW','Questions?<br>We have answers.','주문 · 배송 · 교환 · 반품에 대해<br>자주 묻는 질문을 모았어요.'],
  qna:['scene-blouse.webp','하늘색 아치 앞에 걸린 화이트 블라우스','ASK US','Ask anything.<br>We are here to help.','상품과 사이즈에 대해 궁금한 점을 남겨 주세요.<br>꼼꼼히 확인하고 답변드릴게요.']
 },img=hero.querySelector('img');
 var C=window.WEAR902_CMS;
 // 배경색은 게시판 글과 상관없으므로 기다리지 않고 바로 정한다
 hero.dataset.collection=key;
 function reveal(){hero.classList.add('is-ready')}
 function fill(){
  var data=banners[key]||banners.all;
  // 게시판을 아직 읽는 중이면 채우기만 하고 가려 둔다 (wear-cms.js 의 cms-wait)
  if(!C||!C.holding||!C.holding())hero.classList.add('is-filled');
  img.alt=data[1];hero.querySelector('small').textContent=data[2];hero.querySelector('h1').innerHTML=data[3];hero.querySelector('p').innerHTML=data[4];
  var src=/^(https?:)?\/\/|^\//.test(data[0])?data[0]:'/SkinImg/wear/'+data[0];
  if(img.getAttribute('src')!==src){hero.classList.remove('is-ready');img.src=src}
  img.addEventListener('load',reveal,{once:true});img.addEventListener('error',reveal,{once:true});if(img.complete&&img.naturalWidth)reveal();
 }
 // 기억해 둔 최신 내용이 있으면 페이지를 다 읽기 전에 바로 그린다.
 // 없으면 게시판 글이 다 읽힐 때까지 기다렸다가 그리고, 나중에 새 글이 오면 다시 그린다
 if(C){if(C.applyCachedSection&&C.applyCachedSection(hero))fill();C.ready(fill,1200);document.addEventListener('wear902:cms',fill)}else fill();
 var cur=hero.querySelector('[data-wear-menu="'+key+'"]');if(cur)cur.setAttribute('aria-current','page');
 var form=document.querySelector('.wear-list-search');if(form&&list)form.hidden=false;
}());
</script>
